<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kova - Login</title>
  <link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=2">
  <script src="./js/config.js"></script>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="20" fill="#38BDF8"/>
            <path d="M12 20C12 15.58 15.58 12 20 12C24.42 12 28 15.58 28 20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="20" cy="22" r="4" fill="white"/>
          </svg>
        </div>
        <h1 class="logo-text">Kova</h1>
      </div>
      
      <div class="login-content">
        <h2>Selamat datang</h2>
        <p>Asisten AI pribadi yang selalu siap membantu</p>
        
        <a href="#" id="loginBtn" class="btn-google">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Masuk dengan Google
        </a>
      </div>

      <div class="login-footer">
        <p>Dengan masuk, kamu menyetujui penggunaan data untuk personalisasi AI</p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginBtn').href = API_BASE_URL + '/auth/google';
    // Check if already logged in
    fetch(API_BASE_URL + '/auth/status', { credentials: 'include' })
      .then(r => r.json())
      .then(data => {
        if (data.authenticated) {
          window.location.href = './chat.html';
        }
      });
  </script>
</body>
</html>
